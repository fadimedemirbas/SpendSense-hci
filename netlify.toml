# Netlify deployment for SpendSense (React + Vite PWA in ./frontend).
# This file lives at the repository root so Netlify always finds it; a base
# directory set here overrides the value in the Netlify UI.
#
# Supabase settings are NOT stored here. In Netlify > Site configuration >
# Environment variables, add only browser-safe values:
#   VITE_SUPABASE_URL              (Project URL)
#   VITE_SUPABASE_PUBLISHABLE_KEY  (sb_publishable_... key)
# Never add a secret or service-role key to any VITE_ variable.

[build]
  base = "frontend"
  command = "npm run build"
  # Relative to the base directory: resolves to frontend/dist.
  publish = "dist"

[build.environment]
  # Vite 8 requires Node 20.19+ or 22.12+.
  NODE_VERSION = "22"

# --- Headers -----------------------------------------------------------------

# The service worker must always be revalidated so updates are detected.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build output never changes, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# --- Redirects -----------------------------------------------------------------
# Rules are matched top to bottom. Without `force`, a rule only applies when no
# real file exists at the path, so existing assets, icons, sw.js and the
# manifest are always served as files.

# Missing build files and API-like paths must return a real 404 instead of
# index.html (otherwise an old tab would receive HTML for a JavaScript chunk).
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/icons/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/auth/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/rest/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/rpc/*"
  to = "/404.html"
  status = 404

# SPA fallback: refreshing or directly opening a client-side URL loads the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
